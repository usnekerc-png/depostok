name: Build Depo Stok APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'logo.png'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'logo.png'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Depo-Stok.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Depo-Stok-APK
          path: Depo-Stok.apk
          if-no-files-found: error

      - name: Publish latest APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete depo-stok-latest --cleanup-tag --yes || true
          gh release create depo-stok-latest Depo-Stok.apk \
            --title "Depo Stok APK" \
            --notes "Raw Project Depo Stok Android uygulaması. Bu APK doğrudan Android telefona kurulabilir." \
            --latest
